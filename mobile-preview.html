<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile preview — Eldo</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #1a1a1a;
    color: #fff;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 12px;
    gap: 18px;
  }
  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    background: #2a2a2a;
    border-radius: 999px;
    padding: 6px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 100%;
  }
  .toolbar button {
    background: transparent;
    color: #fff;
    border: 0;
    font-size: 12px;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  .toolbar button:hover { background: #3a3a3a; }
  .toolbar button.active { background: #d97757; }
  .label { font-size: 11px; opacity: 0.55; letter-spacing: 0.05em; }
  .phone {
    width: 390px;
    height: 780px;
    background: #000;
    border-radius: 38px;
    padding: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 0 0 1px #333;
    flex-shrink: 0;
    position: relative;
  }
  .notch {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 26px;
    background: #000;
    border-radius: 14px;
    z-index: 2;
  }
  .screen {
    width: 100%;
    height: 100%;
    border-radius: 28px;
    overflow: hidden;
    background: #fff;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  @media (max-width: 460px) {
    .phone { width: calc(100vw - 24px); height: 720px; }
  }
</style>
</head>
<body>
  <div class="label">390 × 780 — mobile preview</div>
  <div class="toolbar" id="pageBar" style="background:#3a3a3a;">
    <button data-page="index.html" class="active">Početna</button>
    <button data-page="proizvodi.html">Proizvodi</button>
    <button data-page="o-nama.html">O nama</button>
    <button data-page="garancija.html">Garancija</button>
  </div>
  <div class="toolbar" id="toolbar">
    <button data-target="home" class="active">Vrh</button>
    <button data-target="features">Features</button>
    <button data-target="products">Proizvodi</button>
    <button data-target="galerija">Galerija</button>
    <button data-target="process">Proces</button>
    <button data-target="planner">3D Planer</button>
    <button data-target="faq">FAQ</button>
    <button data-target="contact">Kontakt</button>
    <button data-target="footer">Footer</button>
  </div>
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <iframe id="f" src="index.html"></iframe>
    </div>
  </div>
  <script>
    const f = document.getElementById('f');
    const tb = document.getElementById('toolbar');
    const pb = document.getElementById('pageBar');

    pb.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      [...pb.querySelectorAll('button')].forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      f.src = btn.dataset.page;
      // Section jump toolbar only relevant on the homepage
      tb.style.display = btn.dataset.page === 'index.html' ? '' : 'none';
    });

    tb.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      [...tb.querySelectorAll('button')].forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const id = btn.dataset.target;
      try {
        const doc = f.contentDocument;
        if (id === 'home') {
          f.contentWindow.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (id === 'footer') {
          const el = doc.querySelector('footer');
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
          const el = doc.getElementById(id);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      } catch (err) {
        console.warn(err);
      }
    });
  </script>
</body>
</html>
